<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snoozy</title>
<meta name="theme-color" content="#30243D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snoozy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#30243D;--card:#4B3B57;--card2:#66516F;--cream:#FFF5E9;--butter:#E9CC91;--coral:#C58EAF;--mint:#A9BDAF;--lav:#B9A6D3;--muted:#C2B2C9;--blush:#EACDDE;--ink:#30243D;--line:rgba(234,205,222,.13);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Nunito',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background-color:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom));background-image:radial-gradient(130% 55% at 50% -8%,rgba(234,205,222,.17),transparent 62%),radial-gradient(1.5px 1.5px at 12% 9%,rgba(255,245,233,.7) 50%,transparent),radial-gradient(1.2px 1.2px at 82% 13%,rgba(255,245,233,.55) 50%,transparent),radial-gradient(1.5px 1.5px at 92% 41%,rgba(255,245,233,.45) 50%,transparent),radial-gradient(1.2px 1.2px at 7% 55%,rgba(255,245,233,.45) 50%,transparent),radial-gradient(1.2px 1.2px at 64% 72%,rgba(255,245,233,.35) 50%,transparent),linear-gradient(180deg,#30243D,#261C31);background-attachment:fixed}
main{max-width:480px;margin:0 auto;padding:20px 18px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:1.9rem;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
h1::before{content:"";width:.62em;height:.62em;border-radius:50%;box-shadow:inset -.2em -.04em 0 0 var(--butter);transform:rotate(-18deg)}
h3{font-size:1.4rem;margin-bottom:10px;letter-spacing:.01em}.hi{font-family:var(--serif);font-weight:500;font-size:2.1rem;margin:6px 0 0;color:var(--cream)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}#todayLabel{font-size:.88rem}
.card{background:linear-gradient(165deg,#5A4666,#4B3B57);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px;box-shadow:0 12px 32px rgba(16,9,24,.32)}
.btn{border:0;border-radius:999px;padding:14px 20px;font:600 .98rem var(--sans);letter-spacing:.01em;background:linear-gradient(180deg,#F1D8E6,#E6C3D8);color:var(--ink);cursor:pointer;width:100%;margin-top:10px;box-shadow:0 6px 18px rgba(197,142,175,.22)}.btn:active{transform:scale(.98)}.btn.alt{background:rgba(234,205,222,.09);color:var(--cream);border:1px solid rgba(234,205,222,.2);box-shadow:none}.btn:disabled{opacity:.7;cursor:default;transform:none}.btn.small{width:auto;padding:8px 14px;font-size:.9rem;margin:0}.btn:focus-visible,.d:focus-visible,nav button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.moonwrap{display:flex;justify-content:center;margin:26px 0 12px}.moon{width:min(70vw,276px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-content:center;text-align:center;color:var(--ink);background:radial-gradient(circle at 35% 28%,#FFF8EC,#F3E0B8 48%,#E9CC91);box-shadow:0 0 0 14px rgba(234,205,222,.06),0 0 0 32px rgba(234,205,222,.035),0 0 70px rgba(233,204,145,.28),0 0 150px rgba(234,205,222,.16)}.moon small{font-size:.95rem;font-weight:500;letter-spacing:.02em}.moon .big{font-family:var(--serif);font-size:3rem;font-weight:600;line-height:1.05}
.row{display:flex;gap:10px}.row>*{flex:1}.chip{background:linear-gradient(165deg,#5A4666,#4B3B57);border:1px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;box-shadow:0 8px 22px rgba(16,9,24,.25)}.chip b{display:block;font:600 2rem/1.1 var(--serif);color:var(--butter)}.chip span{color:var(--muted);font-size:.88rem}.muted{color:var(--muted)}
label{display:block;color:var(--muted);margin-top:12px;font-size:.92rem}input[type=time]{width:100%;margin-top:5px;padding:12px 14px;border-radius:16px;border:1px solid rgba(234,205,222,.2);background:#2B2036;color:var(--cream);font:500 1.15rem var(--sans);color-scheme:dark}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal .h{color:var(--muted);font-size:.82rem}.d{aspect-ratio:1;border-radius:50%;border:1.5px solid transparent;background:transparent;color:var(--cream);font:500 .95rem var(--sans);cursor:pointer;position:relative;padding:0}.d.plan::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lav)}.d.done{background:var(--mint);color:var(--ink);font-weight:600}.d.missed{border-color:var(--coral);color:#E9BCD3}.d.today{border-color:var(--butter)}.d.sel{box-shadow:0 0 0 3px rgba(234,205,222,.38)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.84rem;color:var(--muted)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.wk{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.wk:last-child{border:0}.tag{padding:3px 11px;border-radius:999px;font-size:.82rem;font-weight:600}.tag.ok{background:var(--mint);color:var(--ink)}.tag.no{background:var(--coral);color:var(--ink)}.tag.wait{background:rgba(234,205,222,.12);color:var(--muted)}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:452px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:26px;background:rgba(40,29,52,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px rgba(10,5,16,.45)}nav button{flex:1;border:0;border-radius:20px;padding:11px 4px;background:transparent;color:var(--muted);font:500 .92rem var(--sans);cursor:pointer}nav button[aria-current=true]{background:rgba(234,205,222,.14);color:var(--butter)}
#ring{position:fixed;inset:0;background:rgba(30,20,40,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px;z-index:10}#ring[hidden],[hidden]{display:none!important}.ringcard{background:linear-gradient(165deg,#5A4666,#4B3B57);border:1px solid var(--line);border-radius:30px;padding:28px 22px;text-align:center;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(10,5,16,.55)}.ringcard::before{content:"";display:block;width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF8EC,#E9CC91);box-shadow:0 0 44px rgba(233,204,145,.45)}.ringcard h2{font-size:2.4rem;margin:6px 0}#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));max-width:448px;margin:auto;background:var(--blush);color:var(--ink);border-radius:18px;padding:14px 16px;font-weight:500;z-index:11;box-shadow:0 10px 30px rgba(10,5,16,.4)}
@media (prefers-reduced-motion:no-preference){.moon{animation:glow 6s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 16px rgba(234,205,222,.07),0 0 0 36px rgba(234,205,222,.04),0 0 90px rgba(233,204,145,.36),0 0 170px rgba(234,205,222,.2)}}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Snoozy</h1><span class="muted" id="todayLabel"></span></div>
  <section id="tonight"></section>
  <section id="calendar" hidden></section>
  <section id="week" hidden></section>
</main>
<nav>
  <button data-tab="tonight" aria-current="true">Tonight</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="week">This week</button>
</nav>
<div id="ring" hidden><div class="ringcard"><div class="muted" id="ringTime"></div><h2 id="ringTitle"></h2><p id="ringBody" class="muted"></p><button class="btn" id="ringMain"></button><button class="btn alt" id="ringSnooze">Snooze 5 min</button></div></div>
<div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);const KEY='snoozy-v1';const DAY=86400000;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return s}catch(e){}return{sched:{},log:{},fired:{},snooze:null}}let S=load();const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const pad=n=>String(n).padStart(2,'0');const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};const at=(day,t)=>{const[h,m]=t.split(':').map(Number);const d=parse(day);d.setHours(h,m,0,0);return d};const addDays=(day,n)=>{const d=parse(day);d.setDate(d.getDate()+n);return ds(d)};const fmt12=t=>{if(!t)return'--';const[h,m]=t.split(':').map(Number);return`${h%12||12}:${pad(m)} ${h<12?'am':'pm'}`};const prettyDay=s=>parse(s).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
let tab='tonight',viewMonth=new Date(),sel=ds(new Date());viewMonth.setDate(1);
function eventsFor(day){const sc=S.sched[day];if(!sc)return[];const ev=[];if(sc.wake){const w=at(day,sc.wake);ev.push({id:day+'wake',day,t:w,kind:'wake',title:'Good morning!',body:'Time to wake up.'});ev.push({id:day+'care',day,t:new Date(+w+30*60000),kind:'care',title:'Morning routine',body:'It has been 30 minutes. Stretching and personal care done?'})}if(sc.bed){const b=at(day,sc.bed);[[60,'Skincare time','Start your night skincare routine.'],[30,'Wind down','30 minutes to bedtime. Start winding down.'],[15,'Journal time','15 minutes to bedtime. Start journaling.']].forEach(([m,title,body])=>ev.push({id:day+'pre'+m,day,t:new Date(+b-m*60000),kind:'pre',title,body}));ev.push({id:day+'bed',day,t:b,kind:'bed',title:'Bedtime',body:'Time for bed. Tap "Off to dreamland" when you are in.'});ev.push({id:day+'miss',day,t:new Date(+b+20*60000),kind:'miss',title:'Still up?',body:'You have not tapped "Off to dreamland" yet.'})}return ev}
function nextEvent(){const now=new Date(),today=ds(now);let best=null;for(let i=-1;i<=2;i++)eventsFor(addDays(today,i)).forEach(e=>{if((e.kind==='wake'||e.kind==='bed')&&e.t>now&&(!best||e.t<best.t))best=e});return best}function tonightDay(){const now=new Date(),y=addDays(ds(now),-1);if(now.getHours()<4&&S.sched[y]&&S.sched[y].bed&&!(S.log[y]&&S.log[y].inBed))return y;return ds(now)}
let audioCtx=null,ringTimer=null,ringing=null;function unlockAudio(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}document.addEventListener('pointerdown',unlockAudio,{once:true});function beep(){try{unlockAudio();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.55);if(navigator.vibrate)navigator.vibrate(200)}catch(e){}}async function notify(title,body){if(!('Notification' in window)||Notification.permission!=='granted')return;try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon-192.svg',tag:title,vibrate:[200,100,200]});else new Notification(title,{body})}catch(e){}}function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,6000)}
function startRing(ev){ringing=ev;$('#ringTime').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('#ringTitle').textContent=ev.title;$('#ringBody').textContent=ev.body;$('#ringMain').textContent=ev.kind==='bed'?"Off to dreamland":"I'm up";$('#ring').hidden=false;clearInterval(ringTimer);beep();ringTimer=setInterval(beep,900)}function stopRing(){clearInterval(ringTimer);ringTimer=null;ringing=null;$('#ring').hidden=true;S.snooze=null;save()}$('#ringMain').onclick=()=>{if(ringing&&ringing.kind==='bed')markInBed(ringing.day);stopRing();render()}$('#ringSnooze').onclick=()=>{if(!ringing)return;S.snooze={ev:{id:ringing.id,day:ringing.day,kind:ringing.kind,title:ringing.title,body:ringing.body},until:Date.now()+5*60000};clearInterval(ringTimer);ringTimer=null;ringing=null;$('#ring').hidden=true;save();toast('Snoozed for 5 minutes.')};function fire(ev){notify(ev.title,ev.body);if(ev.kind==='wake'||ev.kind==='bed')startRing(ev);else{toast(ev.title+': '+ev.body);beep();setTimeout(beep,700)}}function markInBed(day){S.log[day]=Object.assign({},S.log[day],{inBed:Date.now()});save()}
function tick(){const now=new Date(),today=ds(now);for(let i=-1;i<=1;i++){eventsFor(addDays(today,i)).forEach(e=>{const age=now-e.t;if(age<0||age>3*60000||S.fired[e.id])return;const lg=S.log[e.day]||{};if((e.kind==='miss'||e.kind==='pre')&&lg.inBed)return;if(e.kind==='care'&&lg.careDone)return;S.fired[e.id]=1;save();fire(e)})}if(S.snooze&&!ringing&&Date.now()>=S.snooze.until)startRing(S.snooze.ev);updateCountdown()}function updateCountdown(){const el=$('#count');if(!el)return;const n=nextEvent();if(!n)return;const ms=n.t-new Date(),h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);el.textContent=h>0?`${h}h ${pad(m)}m`:`${m}m ${pad(s)}s`}
function streaks(){const done=Object.keys(S.log).filter(k=>S.log[k].inBed).sort();let best=0,run=0,prev=null;done.forEach(k=>{const d=parse(k);run=prev&&Math.round((d-prev)/DAY)===1?run+1:1;best=Math.max(best,run);prev=d});let cur=0,day=ds(new Date());if(!(S.log[day]&&S.log[day].inBed))day=addDays(day,-1);while(S.log[day]&&S.log[day].inBed){cur++;day=addDays(day,-1)}return{cur,best}}function sleepHours(day){const sc=S.sched[day];if(!sc||!sc.bed)return null;const nx=S.sched[addDays(day,1)];const wake=(nx&&nx.wake)||sc.wake;if(!wake)return null;let diff=(at(addDays(day,1),wake)-at(day,sc.bed))/3600000;while(diff>18)diff-=24;return diff>0?diff:null}const hrs=h=>h==null?'--':`${Math.floor(h)}h ${pad(Math.round(h%1*60))}m`;function dayStatus(day){const lg=S.log[day],sc=S.sched[day];if(lg&&lg.inBed)return'done';if(sc&&sc.bed){const now=new Date();if(day<ds(now)||(day===ds(now)&&now>new Date(+at(day,sc.bed)+20*60000)))return'missed';return'plan'}return sc?'plan':''}
function renderTonight(){const td=tonightDay(),sc=S.sched[td],lg=S.log[td]||{},n=nextEvent(),st=streaks();let moon;if(n){const label=n.kind==='bed'?'Bedtime in':'Wake-up in';moon=`<small>${label}</small><div class="big" id="count">--</div><small>at ${fmt12(n.kind==='bed'?S.sched[n.day].bed:S.sched[n.day].wake)}</small>`}else moon=`<small>No times set yet</small><div class="big">Zzz</div>`;const perm='Notification' in window&&Notification.permission==='default';$('#tonight').innerHTML=`<h2 class="hi">Hi, Miss Glow</h2><div class="moonwrap"><div class="moon">${moon}</div></div><div class="row" style="margin-top:14px"><div class="chip"><b>${st.cur}</b><span>day streak</span></div><div class="chip"><b>${st.best}</b><span>best streak</span></div></div><div class="card"><h3>${td===ds(new Date())?'Today':prettyDay(td)}</h3>${sc?`<div class="wk"><span>Wake up</span><b>${fmt12(sc.wake)}</b></div><div class="wk"><span>Bedtime</span><b>${fmt12(sc.bed)}</b></div><div class="wk"><span>Planned sleep</span><b>${hrs(sleepHours(td))}</b></div>`:`<p class="muted" style="margin:0">Pick your wake-up and bedtime to get started.</p>`}${sc?'':`<button class="btn" data-act="goCal">Set my times</button>`}${sc&&sc.bed?(lg.inBed?`<button class="btn alt" disabled>In bed at ${new Date(lg.inBed).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</button>`:`<button class="btn" data-act="sleepy">Off to dreamland</button>`):''}${sc&&sc.wake?(lg.careDone?`<button class="btn alt" disabled>Morning glow done</button>`:`<button class="btn alt" data-act="care">Morning glow done</button>`):''}</div>${perm?`<button class="btn alt" data-act="perm">Turn on notifications</button>`:''}<p class="muted" style="font-size:.85rem;text-align:center">Alarms ring while Snoozy is open. Keep it open at night.</p>`;updateCountdown()}
function renderCalendar(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=ds(new Date());let cells=['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(lead);for(let i=1;i<=days;i++){const day=`${y}-${pad(m+1)}-${pad(i)}`;cells+=`<button class="d ${dayStatus(day)} ${day===today?'today':''} ${day===sel?'sel':''}" data-day="${day}" aria-label="${prettyDay(day)}">${i}</button>`}const sc=S.sched[sel]||{};$('#calendar').innerHTML=`<div class="card"><div class="top" style="margin:0 0 10px"><button class="btn small alt" data-act="prev" aria-label="Previous month">&lt;</button><h3 style="margin:0">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3><button class="btn small alt" data-act="next" aria-label="Next month">&gt;</button></div><div class="cal">${cells}</div><div class="legend"><span><i class="dot" style="background:var(--mint)"></i>In bed</span><span><i class="dot" style="border:2px solid var(--coral)"></i>Missed</span><span><i class="dot" style="background:var(--lav)"></i>Planned</span></div></div><div class="card"><h3>${prettyDay(sel)}</h3><label for="wakeIn">Wake up</label><input type="time" id="wakeIn" value="${sc.wake||''}"><label for="bedIn">Bedtime</label><input type="time" id="bedIn" value="${sc.bed||''}"><button class="btn" data-act="save">Save this day</button><button class="btn alt" data-act="next7">Repeat for the next 7 days</button><button class="btn alt" data-act="wholeWeek">Fill this whole week</button><button class="btn alt" data-act="clear">Clear this day</button></div>`}
function renderWeek(){const today=ds(new Date());let rows='',followed=0,planned=0,total=0,cnt=0;for(let i=6;i>=0;i--){const day=addDays(today,-i),stt=dayStatus(day),sc=S.sched[day],h=sleepHours(day);if(sc&&sc.bed&&stt!=='plan'){planned++;if(stt==='done')followed++}if(h!=null){total+=h;cnt++}const tag=stt==='done'?'<span class="tag ok">In bed</span>':stt==='missed'?'<span class="tag no">Missed</span>':'<span class="tag wait">'+(sc?'Planned':'Not set')+'</span>';rows+=`<div class="wk"><div><b>${parse(day).toLocaleDateString(undefined,{weekday:'short'})}</b> <span class="muted">${sc&&sc.bed?fmt12(sc.bed):''} ${h!=null?'· '+hrs(h):''}</span></div>${tag}</div>`}const st=streaks();$('#week').innerHTML=`<div class="row" style="margin-top:6px"><div class="chip"><b>${followed}/${planned}</b><span>nights on time</span></div><div class="chip"><b>${cnt?hrs(total/cnt):'--'}</b><span>avg planned sleep</span></div></div><div class="row" style="margin-top:10px"><div class="chip"><b>${st.cur}</b><span>day streak</span></div><div class="chip"><b>${st.best}</b><span>best streak</span></div></div><div class="card"><h3>Last 7 days</h3>${rows}</div>`}
function render(){['tonight','calendar','week'].forEach(t=>$('#'+t).hidden=t!==tab);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));({tonight:renderTonight,calendar:renderCalendar,week:renderWeek})[tab]()}function readInputs(){return{wake:$('#wakeIn').value,bed:$('#bedIn').value}}function setDay(day,v){if(v.wake||v.bed)S.sched[day]=Object.assign({},v);else delete S.sched[day]}
document.addEventListener('click',e=>{const nav=e.target.closest('nav button');if(nav){tab=nav.dataset.tab;render();return}const dayBtn=e.target.closest('[data-day]');if(dayBtn){sel=dayBtn.dataset.day;render();return}const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(act==='goCal'){tab='calendar';render()}else if(act==='sleepy'){markInBed(tonightDay());toast('Sweet dreams! Streak updated.');render()}else if(act==='care'){const d=ds(new Date());S.log[d]=Object.assign({},S.log[d],{careDone:Date.now()});save();render()}else if(act==='perm'){Notification.requestPermission().then(render)}else if(act==='prev'){viewMonth.setMonth(viewMonth.getMonth()-1);render()}else if(act==='next'){viewMonth.setMonth(viewMonth.getMonth()+1);render()}else if(act==='save'){setDay(sel,readInputs());save();toast('Saved.');render()}else if(act==='clear'){delete S.sched[sel];save();render()}else if(act==='next7'){const v=readInputs();setDay(sel,v);for(let i=1;i<=7;i++)setDay(addDays(sel,i),v);save();toast('Copied to the next 7 days.');render()}else if(act==='wholeWeek'){const v=readInputs(),mon=(parse(sel).getDay()+6)%7;for(let i=0;i<7;i++)setDay(addDays(sel,i-mon),v);save();toast('Filled Monday to Sunday.');render()}});
$('#todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();tick();setInterval(tick,1000);
</script>
</body>
</html>
